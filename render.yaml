services:
  - type: web
    name: greed-index-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m data.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./greed_index.db
      # Comma-separated list of allowed frontend origins (production domain(s)).
      # *.vercel.app previews are already allowed via regex in app/main.py.
      - key: FRONTEND_URL
        sync: false
    plan: free
